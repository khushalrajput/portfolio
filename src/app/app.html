<div class="vscode-shell">
  <!-- Title Bar -->
  <app-title-bar />

  <!-- Menu Bar -->
  <app-menu-bar />

  <!-- Main Content Area -->
  <div class="vscode-main">
    <!-- Activity Bar -->
    <app-activity-bar />

    <!-- Sidebar -->
    @if (sidebarService.isOpen()) {
      <app-sidebar />
    }

    <!-- Editor Area -->
    <div class="vscode-editor-area">
      <!-- Tab Bar -->
      <app-tab-bar />

      <!-- Breadcrumb -->
      <app-breadcrumb />

      <!-- Editor Content -->
      <div class="vscode-editor-content">
        <router-outlet />
      </div>

      <!-- Terminal Pane -->
      <app-terminal-pane />
    </div>

    <!-- Copilot Right Panel -->
    @if (sidebarService.copilotOpen()) {
      <app-copilot-chat-panel />
    }
  </div>

  <!-- Status Bar -->
  <app-status-bar />
</div>
